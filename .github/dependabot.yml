version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Só sugere versões publicadas há pelo menos 14 dias.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # A partir da 2.1.0, os scripts Lua usam a flag allow-key-locking, que só
      # o Upstash aceita. O Redis do docker-compose e do CI recusa o script.
      - dependency-name: "@upstash/ratelimit"
        versions: [">=2.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
